<!DOCTYPE html>
<html>
<head>
    <title>SHL Chat API Response</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 8px 8px 0 0;
            border-bottom: 3px solid #667eea;
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .main {
            background: white;
            padding: 30px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-section h2 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-group textarea {
            height: 120px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-send:active {
            transform: translateY(0);
        }
        
        .quick-tests {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .quick-btn {
            padding: 10px 15px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .response-section {
            margin-top: 30px;
            border-top: 2px solid #f0f0f0;
            padding-top: 30px;
        }
        
        .response-section h2 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .response-status {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        .status-item {
            flex: 1;
        }
        
        .status-label {
            color: #999;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .status-value {
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status-value.success {
            color: #27ae60;
        }
        
        .status-value.error {
            color: #e74c3c;
        }
        
        .response-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 6px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        .response-box pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .json-key { color: #9cdcfe; }
        .json-string { color: #ce9178; }
        .json-number { color: #b5cea8; }
        .json-boolean { color: #569cd6; }
        .json-null { color: #569cd6; }
        
        .reply-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        
        .reply-box h3 {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .reply-box p {
            font-size: 16px;
            line-height: 1.6;
        }
        
        .recommendations-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }
        
        .recommendations-box h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .recommendation-item {
            padding: 12px;
            background: white;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .recommendation-item:last-child {
            margin-bottom: 0;
        }
        
        .rec-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .rec-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 10px;
        }
        
        .rec-url {
            color: #667eea;
            font-size: 12px;
            word-break: break-all;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }
        
        .rec-url a {
            color: #667eea;
            text-decoration: none;
        }
        
        .rec-url a:hover {
            text-decoration: underline;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #c33;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 SHL Assessment Recommender Chat</h1>
            <p>Test the chat API directly in your browser</p>
        </div>
        
        <div class="main">
            <!-- INPUT SECTION -->
            <div class="input-section">
                <h2>Send Message to Agent</h2>
                
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: 600; color: #555; display: block; margin-bottom: 10px; font-size: 13px;">Quick Tests:</label>
                    <div class="quick-tests">
                        <button class="quick-btn" onclick="loadTest('vague')">Vague Query</button>
                        <button class="quick-btn" onclick="loadTest('java')">Java Senior</button>
                        <button class="quick-btn" onclick="loadTest('personality')">Java + Personality</button>
                        <button class="quick-btn" onclick="loadTest('compare')">Compare OPQ vs GSA</button>
                        <button class="quick-btn" onclick="loadTest('datascience')">Data Scientist</button>
                        <button class="quick-btn" onclick="loadTest('offTopic')">Off-Topic Test</button>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Your Message:</label>
                    <textarea id="userMessage" placeholder="Type your hiring query here...">Java developer, senior level, need personality assessment too</textarea>
                </div>
                
                <button class="btn-send" onclick="sendMessage()">Send to Agent</button>
            </div>
            
            <!-- RESPONSE SECTION -->
            <div class="response-section">
                <h2>Agent Response</h2>
                
                <div id="responseContainer">
                    <div class="empty-state">
                        <p>👈 Type a message and click "Send" to see the response here</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://shl-research-intern-u95m.onrender.com/chat';
        let conversationHistory = [];
        
        const testCases = {
            vague: {
                message: 'I need an assessment',
                description: 'Vague query - should ask for clarification'
            },
            java: {
                message: 'Java developer, senior level, 8+ years experience',
                description: 'Detailed query - should return recommendations'
            },
            personality: {
                message: 'Java developer, senior, need personality and leadership assessment',
                description: 'With personality signal - should include personality tests'
            },
            compare: {
                message: 'Compare OPQ and GSA',
                description: 'Comparison request - should provide grounded comparison'
            },
            datascience: {
                message: 'Hiring a data scientist, need to assess technical and analytical skills',
                description: 'Data scientist role - should recommend data/analytics focused tests'
            },
            offTopic: {
                message: 'What is the average salary for a Java developer?',
                description: 'Off-topic query - should refuse and stay in scope'
            }
        };
        
        function loadTest(testName) {
            const test = testCases[testName];
            document.getElementById('userMessage').value = test.message;
            // Auto-send after loading
            setTimeout(sendMessage, 100);
        }
        
        async function sendMessage() {
            const message = document.getElementById('userMessage').value.trim();
            
            if (!message) {
                alert('Please enter a message');
                return;
            }
            
            // Add user message to history
            conversationHistory.push({
                role: 'user',
                content: message
            });
            
            const responseContainer = document.getElementById('responseContainer');
            responseContainer.innerHTML = `
                <div class="empty-state">
                    <div class="spinner"></div>
                    <p>Sending message to agent...</p>
                </div>
            `;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: conversationHistory
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // Add assistant message to history
                conversationHistory.push({
                    role: 'assistant',
                    content: data.reply
                });
                
                displayResponse(data);
            } catch (error) {
                responseContainer.innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong> ${error.message}<br>
                        <small>Make sure the API endpoint is accessible</small>
                    </div>
                `;
            }
        }
        
        function displayResponse(data) {
            const responseContainer = document.getElementById('responseContainer');
            
            // Status
            const statusHtml = `
                <div class="response-status">
                    <div class="status-item">
                        <div class="status-label">Status</div>
                        <div class="status-value success">✓ 200 OK</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Conversation Ended</div>
                        <div class="status-value">${data.end_of_conversation ? 'Yes' : 'No'}</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Recommendations</div>
                        <div class="status-value">${data.recommendations.length} items</div>
                    </div>
                </div>
            `;
            
            // Agent Reply
            const replyHtml = `
                <div class="reply-box">
                    <h3>Agent Reply:</h3>
                    <p>${escapeHtml(data.reply)}</p>
                </div>
            `;
            
            // Recommendations
            let recommendationsHtml = '';
            if (data.recommendations.length > 0) {
                recommendationsHtml = `
                    <div class="recommendations-box">
                        <h3>📋 Recommended Assessments (${data.recommendations.length}):</h3>
                        ${data.recommendations.map((rec, idx) => `
                            <div class="recommendation-item">
                                <div class="rec-name">${idx + 1}. ${escapeHtml(rec.name)}</div>
                                <div>
                                    <span class="rec-type">${rec.test_type}</span>
                                </div>
                                <div class="rec-url">
                                    <a href="${rec.url}" target="_blank" title="Open in new tab">
                                        🔗 ${rec.url}
                                    </a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                recommendationsHtml = `
                    <div class="recommendations-box">
                        <h3>📋 Recommendations:</h3>
                        <p style="color: #999; font-size: 14px;">No recommendations at this time (agent gathering context or refusing request)</p>
                    </div>
                `;
            }
            
            // Full JSON Response
            const jsonHtml = `
                <div style="margin-top: 20px;">
                    <h3 style="color: #333; font-size: 14px; margin-bottom: 10px; font-weight: 600;">Raw JSON Response:</h3>
                    <div class="response-box">
                        <pre>${syntaxHighlight(JSON.stringify(data, null, 2))}</pre>
                    </div>
                </div>
            `;
            
            responseContainer.innerHTML = statusHtml + replyHtml + recommendationsHtml + jsonHtml;
        }
        
        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
